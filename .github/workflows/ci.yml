name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Build the unsigned installer
        run: npx tauri build --bundles nsis -- --locked
      - name: Install, start and uninstall
        shell: pwsh
        run: ./scripts/windows/check-install.ps1 -Installer (Get-Item 'src-tauri/target/release/bundle/nsis/*.exe').FullName -Screenshot (Join-Path $env:RUNNER_TEMP 'screen-windows.png')
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-start-windows
          path: ${{ runner.temp }}/screen-windows.png*
          retention-days: 7
      # For trying a pull request. Releases are built and signed by release.yml, never from these.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/screen-windows.png
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: cargo test --locked
        working-directory: src-tauri
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the unsigned disk image
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg -- --locked
      - name: Start the app
        run: node scripts/smoke.mjs "$(find "src-tauri/target/universal-apple-darwin/release/bundle/macos/Grove Companion.app/Contents/MacOS" -type f -perm -u+x)" "$RUNNER_TEMP/screen-macos.png"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-start-macos
          path: ${{ runner.temp }}/screen-macos.png*
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/screen-macos.png
          if-no-files-found: error
          retention-days: 7

  # The one check the main branch's ruleset requires, so the jobs above can change without changing it.
  required:
    name: Required checks
    if: always()
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - env:
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          if [ "$WINDOWS" != success ] || [ "$MACOS" != success ]; then
            echo "::error::Windows: $WINDOWS, macOS: $MACOS."
            exit 1
          fi
