# A feat or fix merged to main becomes a GitHub release, once RELEASES_ENABLED is true.
#
# Safe: nothing is public until both installers are built, tested, started, signed and checked. They wait
# in a draft release, and only the last job tags it and makes it public. No step falls back to an unsigned
# build, and builds use no caches, so a pull request's run cannot feed anything into a release.
#
# Deterministic: the version comes from the commits since the last tag, and the runners, toolchains and
# dependencies are all pinned.
#
# Idempotent: every job can run again. A failed run can be re-run from its failed jobs, and a later merge
# takes over a draft an earlier run left behind.
#
# Running this workflow by hand rehearses a release: the same signed builds and checks, publishing nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
        working-directory: .github/release
      - id: plan
        env:
          RELEASE_PLAN_DIR: ${{ runner.temp }}/release-plan
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases and rehearsals run from main only, not $GITHUB_REF."
            exit 1
          fi
          git clone --quiet --bare . "$RUNNER_TEMP/origin.git"
          node .github/release/node_modules/semantic-release/bin/semantic-release.js --dry-run --repository-url "file://$RUNNER_TEMP/origin.git"
          version=
          if [ -f "$RELEASE_PLAN_DIR/version" ]; then
            version=$(cat "$RELEASE_PLAN_DIR/version")
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The planned version \"$version\" is not a plain release version."
              exit 1
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::notice::Rehearsal of ${version:-a build with no new version}: nothing will be published."
            echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$version" ]; then
            echo "Nothing to release: no feat or fix since the last release."
          elif [ "$RELEASES_ENABLED" != true ]; then
            echo "::notice::Would release $version, but the repository variable RELEASES_ENABLED is not true. The next merge after it is set releases everything since the last release."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  windows:
    name: Windows installer
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build, with the app, installer and uninstaller signed
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'release.conf.json'
          @{
            version = $env:VERSION
            bundle = @{ windows = @{ signCommand = @{
              cmd = 'pwsh.exe'
              args = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
                '-File', (Join-Path $env:GITHUB_WORKSPACE 'scripts\windows\sign.ps1'),
                '-Tools', (Join-Path $env:RUNNER_TEMP 'signing-tools'),
                '-Endpoint', 'https://eus.codesigning.azure.net',
                '-Account', 'agent-guild-signing',
                '-CertificateProfile', 'agent-guild-public',
                '-Files', '%1')
            } } }
          } | ConvertTo-Json -Depth 6 | Set-Content -Path $config -Encoding utf8
          npx tauri build --bundles nsis --config $config -- --locked
          if ($LASTEXITCODE -ne 0) { throw "The build failed with exit code $LASTEXITCODE." }
      - name: Start the signed app
        shell: bash
        run: node scripts/smoke.mjs src-tauri/target/release/agent-guild-companions.exe "$RUNNER_TEMP/screen-windows.png"
      - name: Check the signature and collect the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          if (-not $env:PUBLISHER) { throw 'The repository has no WINDOWS_PUBLISHER variable.' }
          $built = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($built.Count -ne 1 -or $built[0].Name -notlike "*_$($env:VERSION)_*") { throw "Expected one installer for $env:VERSION, found: $($built.Name -join ', ')." }
          $signed = @($built[0].FullName, (Resolve-Path 'src-tauri/target/release/agent-guild-companions.exe').Path)
          foreach ($file in $signed) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -ne $env:PUBLISHER) {
              throw "$file is not signed and timestamped by $env:PUBLISHER ($($signature.Status), $($signature.SignerCertificate.Subject))."
            }
          }
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'installer')
          Copy-Item -LiteralPath $built[0].FullName (Join-Path $out 'Grove-Companion-windows-setup.exe')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: ${{ runner.temp }}/installer/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  macos:
    name: macOS disk image
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 240
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build, signed and notarized
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_API_KEY: ${{ vars.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.ASC_ISSUER_ID }}
        run: |
          # Without these the build would succeed, unsigned.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_KEY_P8 APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::The release-signing environment does not provide $name."
              exit 1
            fi
          done
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$APPLE_API_KEY_PATH")
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          printf '{"version":"%s"}' "$VERSION" > "$RUNNER_TEMP/release.conf.json"
          npx tauri build --target universal-apple-darwin --bundles dmg --config "$RUNNER_TEMP/release.conf.json" -- --locked
      - name: Start the signed app
        run: node scripts/smoke.mjs "$(find "src-tauri/target/universal-apple-darwin/release/bundle/macos/Grove Companion.app/Contents/MacOS" -type f -perm -u+x)" "$RUNNER_TEMP/screen-macos.png"
      - name: Check the signature and notarization, and collect the disk image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Grove Companion.app"
          codesign --verify --deep --strict "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"
          shopt -s nullglob
          built=("$bundle"/dmg/*_"$VERSION"_*.dmg)
          if [ "${#built[@]}" != 1 ]; then
            echo "::error::Expected one disk image for $VERSION, found ${#built[@]}."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/installer"
          cp "${built[0]}" "$RUNNER_TEMP/installer/Grove-Companion-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-macos
          path: ${{ runner.temp }}/installer/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  draft:
    name: Draft release
    needs: [plan, windows, macos]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-macos
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Grove-Companion-windows-setup.exe
            Grove-Companion-macos.dmg
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          installers=(Grove-Companion-windows-setup.exe Grove-Companion-macos.dmg)
          sha256sum -- "${installers[@]}" > SHA256SUMS
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "Release $tag of this commit is already public."
              exit 0
            fi
            echo "::error::Release $tag is public at $tagged, and a public release is never replaced."
            exit 1
          elif [ "$state" = true ]; then
            # An earlier run stopped here, or a newer merge has taken over its version.
            gh release upload "$tag" --clobber "${installers[@]}" SHA256SUMS
            gh release edit "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md "${installers[@]}" SHA256SUMS
          fi
          # Check what the release holds, not what was sent.
          mkdir held
          for file in "${installers[@]}" SHA256SUMS; do
            gh release download "$tag" --pattern "$file" --dir held
            cmp "$file" "held/$file"
          done

  release:
    name: Tag and publish
    needs: [plan, draft]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if tagged=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points at $tagged, not at $GITHUB_SHA."
              exit 1
            fi
          else
            gh api "repos/$GH_REPO/git/refs" --silent -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          gh release edit "$tag" --verify-tag --draft=false --latest

  report:
    name: Say what happened
    needs: [plan, windows, macos, draft, release]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          {
            echo "## The release did not finish"
            echo
            if [ "$RELEASE_RESULT" = failure ]; then
              echo "The installers are ready, but the last step failed, so the release may still be a draft. **Re-run the failed jobs** to finish it."
            else
              echo "Nothing was published. **Re-run the failed jobs** if the cause was passing, or fix it and merge: the next merge releases everything since the last release."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
